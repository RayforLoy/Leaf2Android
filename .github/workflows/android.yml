name: Android build and protocol checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install Android SDK 36
        shell: pwsh
        run: |
          $manager = Join-Path $env:ANDROID_HOME 'cmdline-tools\latest\bin\sdkmanager.bat'
          & $manager 'platforms;android-36' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK installation failed' }
          ('sdk.dir=' + $env:ANDROID_HOME.Replace('\','/')) | Set-Content local.properties -Encoding ascii
      - name: Verify reference inputs and Python research tests
        shell: pwsh
        run: |
          python -m pip install -r requirements-research.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed' }
          python tools/acquire_sources.py verify
          if ($LASTEXITCODE -ne 0) { throw 'Reference checksum verification failed' }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Research tests failed' }
      - name: Compile, lint and test Android protocol
        shell: pwsh
        run: |
          .\gradlew.bat :protocol:test :app:lintDebug :app:assembleDebug --console plain
          if ($LASTEXITCODE -ne 0) { throw 'Android checks failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Leaf2Android-debug-and-reports
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/lint-results-debug.*
            protocol/build/reports/tests/test/**
            protocol/build/test-results/test/*.xml
